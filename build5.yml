          enum DlStatus { queued, downloading, paused, completed, failed }

          /// رسالة التوقف عند انتظار الواي فاي (تُستخدم للاستئناف التلقائي).
          const String kWaitWifi = 'متوقف: بانتظار اتصال واي فاي';

          class DownloadItem {
            DownloadItem({
              required this.id,
              required this.url,
              required this.name,
              required this.path,
              required this.connections,
              this.total = 0,
              this.status = DlStatus.queued,
              List<int>? segDone,
              this.resumable = true,
              this.error,
              this.kind = 'http',
              this.ytId,
              this.ytItag,
              this.allowMobile = false,
              Map<String, String>? headers,
              DateTime? createdAt,
            })  : segDone = segDone ?? [],
                  headers = headers ?? {},
                  createdAt = createdAt ?? DateTime.now();

            final String id;
            String url;
            String name;
            String path;
            int connections;
            int total;
            DlStatus status;
            List<int> segDone;
            bool resumable;
            String? error;

            /// 'http' للتحميل العادي، 'yt' ليوتيوب
            String kind;
            String? ytId;
            int? ytItag;

            /// سماح خاص بالتحميل عبر بيانات الهاتف لهذا الملف (حتى لو الواي فاي فقط مفعّل)
            bool allowMobile;

            /// ترويسات إضافية (Cookie / User-Agent / Referer) تأتي من المتصفح
            Map<String, String> headers;
            final DateTime createdAt;

            /// bytes/second، محسوبة أثناء التحميل فقط ولا تُحفظ.
            double speed = 0;

            bool get isYt => kind == 'yt';
            int get done => segDone.fold(0, (a, b) => a + b);
            double get progress => total > 0 ? (done / total).clamp(0.0, 1.0) : 0.0;
            int get segCount => resumable ? connections : 1;

            int segStart(int i) => (total ~/ segCount) * i;
            int segEnd(int i) =>
                i == segCount - 1 ? total - 1 : (total ~/ segCount) * (i + 1) - 1;
            double segProgress(int i) {
              if (!resumable || total == 0 || i >= segDone.length) return 0;
              final len = segEnd(i) - segStart(i) + 1;
              return (segDone[i] / len).clamp(0.0, 1.0);
            }

            Duration? get eta {
              if (speed <= 1 || total == 0) return null;
              return Duration(seconds: ((total - done) / speed).round());
            }

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'url': url,
                  'name': name,
                  'path': path,
                  'connections': connections,
                  'total': total,
                  'status': status.name,
                  'segDone': segDone,
                  'resumable': resumable,
                  'error': error,
                  'kind': kind,
                  'ytId': ytId,
                  'ytItag': ytItag,
                  'allowMobile': allowMobile,
                  'headers': headers,
                  'createdAt': createdAt.toIso8601String(),
                };

            factory DownloadItem.fromJson(Map<String, dynamic> j) => DownloadItem(
                  id: j['id'] as String,
                  url: j['url'] as String,
                  name: j['name'] as String,
                  path: j['path'] as String,
                  connections: j['connections'] as int,
                  total: j['total'] as int,
                  status: DlStatus.values.byName(j['status'] as String),
                  segDone: (j['segDone'] as List).cast<int>(),
                  resumable: j['resumable'] as bool,
                  error: j['error'] as String?,
                  kind: (j['kind'] as String?) ?? 'http',
                  ytId: j['ytId'] as String?,
                  ytItag: j['ytItag'] as int?,
                  allowMobile: (j['allowMobile'] as bool?) ?? false,
                  headers: ((j['headers'] as Map?) ?? {}).map(
                      (k, v) => MapEntry(k.toString(), v.toString())),
                  createdAt: DateTime.parse(j['createdAt'] as String),
                );
          }
