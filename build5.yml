          package com.example.dlmanager

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.Uri
          import android.os.Build
          import android.os.PowerManager
          import android.provider.MediaStore
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private var pendingNotif: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "dl/service")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  startSvc(
                                      call.argument<String>("title") ?: "",
                                      call.argument<String>("text") ?: "",
                                      call.argument<Int>("progress") ?: -1
                                  )
                                  result.success(true)
                              }
                              "update" -> {
                                  val t = call.argument<String>("title") ?: ""
                                  val x = call.argument<String>("text") ?: ""
                                  val p = call.argument<Int>("progress") ?: -1
                                  val s = DownloadService.instance
                                  if (s != null) s.update(t, x, p) else startSvc(t, x, p)
                                  result.success(true)
                              }
                              "stop" -> {
                                  stopService(Intent(this, DownloadService::class.java))
                                  result.success(true)
                              }
                              "isIgnoringBattery" -> {
                                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                                  result.success(
                                      Build.VERSION.SDK_INT < 23 ||
                                          pm.isIgnoringBatteryOptimizations(packageName)
                                  )
                              }
                              "requestIgnoreBattery" -> {
                                  try {
                                      val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                      i.data = Uri.parse("package:$packageName")
                                      startActivity(i)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              "requestNotifPermission" -> {
                                  if (Build.VERSION.SDK_INT < 33 ||
                                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) ==
                                      PackageManager.PERMISSION_GRANTED
                                  ) {
                                      result.success(true)
                                  } else {
                                      pendingNotif = result
                                      requestPermissions(
                                          arrayOf(Manifest.permission.POST_NOTIFICATIONS), 77
                                      )
                                  }
                              }
                              "isMetered" -> {
                                  val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                                  result.success(cm.isActiveNetworkMetered)
                              }
                              "notifyDone" -> {
                                  notifyDone(
                                      call.argument<String>("title") ?: "",
                                      call.argument<String>("text") ?: ""
                                  )
                                  result.success(true)
                              }
                              "saveToDownloads" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val name = call.argument<String>("name") ?: "file"
                                  val mime = call.argument<String>("mime") ?: "application/octet-stream"
                                  Thread {
                                      val ok = try {
                                          copyToDownloads(path, name, mime)
                                      } catch (e: Exception) {
                                          false
                                      }
                                      runOnUiThread { result.success(ok) }
                                  }.start()
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun startSvc(title: String, text: String, progress: Int) {
                  val i = Intent(this, DownloadService::class.java)
                      .putExtra("title", title)
                      .putExtra("text", text)
                      .putExtra("progress", progress)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
              }

              @Suppress("DEPRECATION")
              private fun notifyDone(title: String, text: String) {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(
                              "dl_done", "اكتمال التحميل", NotificationManager.IMPORTANCE_DEFAULT
                          )
                      )
                  }
                  val launch = packageManager.getLaunchIntentForPackage(packageName) ?: Intent()
                  val pi = PendingIntent.getActivity(
                      this, 1, launch,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, "dl_done")
                  } else {
                      Notification.Builder(this)
                  }
                  b.setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                  nm.notify((System.currentTimeMillis() % 100000).toInt() + 100, b.build())
              }

              private fun copyToDownloads(path: String, name: String, mime: String): Boolean {
                  if (Build.VERSION.SDK_INT < 29) return false
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, name)
                      put(MediaStore.Downloads.MIME_TYPE, mime)
                      put(MediaStore.Downloads.IS_PENDING, 1)
                  }
                  val resolver = contentResolver
                  val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: return false
                  val out = resolver.openOutputStream(uri) ?: return false
                  out.use { o -> File(path).inputStream().use { it.copyTo(o) } }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  resolver.update(uri, values, null, null)
                  return true
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 77) {
                      pendingNotif?.success(
                          grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                      )
                      pendingNotif = null
                  }
              }
          }
          DART_EOF
          cat > android/app/src/main/kotlin/com/example/dlmanager/DownloadService.kt <<'DART_EOF'
          package com.example.dlmanager

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /** خدمة أمامية: تبقي التطبيق حياً أثناء التحميل مع إطفاء الشاشة أو الانتقال لتطبيق آخر. */
          class DownloadService : Service() {
              companion object {
                  @Volatile
                  var instance: DownloadService? = null
                  const val CHANNEL = "dl_channel"
                  const val NOTIF_ID = 1
              }

              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null
              private var title = "مدير التحميلات"
              private var text = ""
              private var progress = -1

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  if (Build.VERSION.SDK_INT >= 26) {
                      val ch = NotificationChannel(
                          CHANNEL, "التحميلات", NotificationManager.IMPORTANCE_LOW
                      )
                      ch.setShowBadge(false)
                      (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                          .createNotificationChannel(ch)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  title = intent?.getStringExtra("title") ?: title
                  text = intent?.getStringExtra("text") ?: text
                  progress = intent?.getIntExtra("progress", -1) ?: -1
                  val n = build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
                  acquireLocks()
                  return START_NOT_STICKY
              }

              fun update(t: String, x: String, p: Int) {
                  title = t
                  text = x
                  progress = p
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .notify(NOTIF_ID, build())
              }

              @Suppress("DEPRECATION")
              private fun build(): Notification {
                  val launch = packageManager.getLaunchIntentForPackage(packageName) ?: Intent()
                  val pi = PendingIntent.getActivity(
                      this, 0, launch,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, CHANNEL)
                  } else {
                      Notification.Builder(this)
                  }
                  b.setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                  if (progress in 0..100) b.setProgress(100, progress, false)
                  return b.build()
              }

              @Suppress("DEPRECATION")
              private fun acquireLocks() {
                  if (wake == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "dlmanager:download")
                      wake?.setReferenceCounted(false)
                  }
                  if (wake?.isHeld == false) wake?.acquire()

                  if (wifi == null) {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      wifi = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "dlmanager:wifi")
                      wifi?.setReferenceCounted(false)
                  }
                  if (wifi?.isHeld == false) wifi?.acquire()
              }

              private fun releaseLocks() {
                  if (wake?.isHeld == true) wake?.release()
                  if (wifi?.isHeld == true) wifi?.release()
              }

              override fun onDestroy() {
                  releaseLocks()
                  instance = null
                  super.onDestroy()
              }
          }
          DART_EOF
