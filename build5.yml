name: Build APK v5
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and write sources
        run: |
          set -e
          flutter create --org com.example --project-name dlmanager app
          cd app
          rm -rf test lib/*
          mkdir -p lib/models lib/services lib/screens assets android/app/src/main/kotlin/com/example/dlmanager
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="dlmanager"|android:label="مدير التحميلات"|' $M
          sed -i 's|</application>|<service android:name=".DownloadService" android:exported="false" android:foregroundServiceType="dataSync"/>\n    </application>|' $M
          base64 -d > assets/icon.png <<'B64_EOF'
