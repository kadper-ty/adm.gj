            Future<void> setDefaultConnections(int v) async {
              defaultConnections = v;
              (await SharedPreferences.getInstance()).setInt('defconn', v);
              notifyListeners();
            }

            // ---------- إحصائيات ----------

            double get totalSpeed => items
                .where((e) => e.status == DlStatus.downloading)
                .fold(0.0, (a, b) => a + b.speed);
            int get activeCount =>
                items.where((e) => e.status == DlStatus.downloading).length;
            int get completedCount =>
                items.where((e) => e.status == DlStatus.completed).length;

            // ---------- العمليات ----------

            String _cleanName(String name) =>
                name.replaceAll(RegExp(r'[\\/:*?"<>|]'), '_').trim();

            String _uniqueName(String name) {
              var candidate = name.isEmpty ? 'file' : name;
              final dot = candidate.lastIndexOf('.');
              final stem = dot > 0 ? candidate.substring(0, dot) : candidate;
              final ext = dot > 0 ? candidate.substring(dot) : '';
              var n = 1;
              while (File('${dir.path}/$candidate').existsSync() ||
                  items.any((e) => e.name == candidate)) {
                candidate = '$stem ($n)$ext';
                n++;
              }
              return candidate;
            }

            Future<DownloadItem> add(
              String url,
              String name,
              int connections, {
              Map<String, String>? headers,
            }) async {
              final safe = _uniqueName(_cleanName(name));
              final it = DownloadItem(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                url: url.trim(),
                name: safe,
                path: '${dir.path}/$safe',
                connections: connections,
                headers: headers,
              );
              items.insert(0, it);
              await _save();
              notifyListeners();
              start(it);
              return it;
            }

            Future<DownloadItem> addYoutube({
              required String videoId,
              required String title,
              required int itag,
              required String ext,
              required int size,
            }) async {
              var t = _cleanName(title);
              if (t.length > 80) t = t.substring(0, 80).trim();
              final safe = _uniqueName('$t.$ext');
              final it = DownloadItem(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                url: 'https://www.youtube.com/watch?v=$videoId',
                name: safe,
                path: '${dir.path}/$safe',
                connections: 1,
                total: size,
                resumable: false,
                kind: 'yt',
                ytId: videoId,
                ytItag: itag,
              );
              items.insert(0, it);
              await _save();
              notifyListeners();
              start(it);
              return it;
            }

            Future<void> start(DownloadItem it, {bool mobileOk = false}) async {
              if (_tokens.containsKey(it.id)) return;
              if (mobileOk) it.allowMobile = true;
              if (activeCount >= maxConcurrent) {
                it.status = DlStatus.queued;
                it.error = null;
                _save();
                notifyListeners();
                return;
              }
              final token = CancelToken();
              _tokens[it.id] = token;
              it.status = DlStatus.downloading;
              it.error = null;
              _lastDone[it.id] = it.done;
              _ensureTicker();
              notifyListeners();

              try {
                if (wifiOnly && !it.allowMobile && await BackgroundService.isMetered()) {
                  it.status = DlStatus.paused;
                  it.error = kWaitWifi;
                  token.cancel();
                  return;
                }
                if (it.isYt) {
                  await _downloadYt(it, token);
                } else {
                  await _downloadHttp(it, token);
                }
                if (token.isCancelled) return; // إيقاف مؤقت أو حذف
                await _merge(it);
                it.status = DlStatus.completed;
                it.speed = 0;
                BackgroundService.notifyDone(it.name);
              } on DioException catch (e) {
                if (!CancelToken.isCancel(e)) {
                  token.cancel();
                  it.status = DlStatus.failed;
                  it.error = _friendly(e);
                }
              } catch (e) {
                token.cancel();
                it.status = DlStatus.failed;
                it.error = e.toString().replaceFirst('Exception: ', '');
              } finally {
                _tokens.remove(it.id);
                await _save();
                notifyListeners();
                _pump();
              }
            }

            /// يشغّل التحميلات المنتظرة كلما صار في مكان.
            void _pump() {
              for (final it in items.reversed.toList()) {
                if (activeCount >= maxConcurrent) break;
                if (it.status == DlStatus.queued && !_tokens.containsKey(it.id)) {
                  start(it);
                }
              }
            }

            void pauseAll() {
              for (final it in items.toList()) {
                if (it.status == DlStatus.queued) it.status = DlStatus.paused;
                pause(it);
              }
              notifyListeners();
            }

            void resumeAll() {
              for (final it in items.reversed.toList()) {
                if (it.status == DlStatus.paused || it.status == DlStatus.failed) {
                  start(it);
                }
              }
            }

            void clearCompleted() {
              final done =
                  items.where((e) => e.status == DlStatus.completed).toList();
              for (final it in done) {
                items.remove(it);
              }
              _save();
              notifyListeners();
            }

            String _friendly(DioException e) {
              switch (e.type) {
                case DioExceptionType.connectionTimeout:
                case DioExceptionType.receiveTimeout:
                case DioExceptionType.sendTimeout:
                  return 'انتهت مهلة الاتصال';
                case DioExceptionType.connectionError:
                  return 'تعذر الاتصال بالخادم';
                case DioExceptionType.badResponse:
                  final c = e.response?.statusCode;
                  if (c == 403 || c == 401 || c == 410 || c == 404) {
                    return 'الرابط انتهت صلاحيته ($c). استخدم "تجديد الرابط"';
                  }
                  return 'رد الخادم: $c';
                default:
                  return 'فشل التحميل';
              }
            }

            // ---------- تحميل عادي (HTTP) ----------

            Future<void> _downloadHttp(DownloadItem it, CancelToken token) async {
              if (it.total == 0) await _probe(it, token);
              if (it.segDone.length != it.segCount) {
                it.segDone = List.filled(it.segCount, 0);
              }
              _syncFromDisk(it);

              for (var attempt = 0;; attempt++) {
                final at = CancelToken();
                token.whenCancel.then((_) {
                  if (!at.isCancelled) at.cancel();
                });
                try {
                  await Future.wait(
                    [for (var i = 0; i < it.segCount; i++) _segment(it, i, at)],
                    eagerError: true,
                  );
                  return;
                } on DioException catch (e) {
                  if (!at.isCancelled) at.cancel();
                  final retriable = !CancelToken.isCancel(e) &&
                      attempt < 3 &&
                      (e.type == DioExceptionType.connectionError ||
                          e.type == DioExceptionType.connectionTimeout ||
                          e.type == DioExceptionType.receiveTimeout);
                  if (!retriable || token.isCancelled) rethrow;
                  await Future.delayed(Duration(seconds: 2 * (attempt + 1)));
                  if (token.isCancelled) return;
                  _syncFromDisk(it);
                }
              }
            }

            void _syncFromDisk(DownloadItem it) {
              for (var i = 0; i < it.segCount; i++) {
                final f = File('${it.path}.part$i');
                if (!it.resumable && f.existsSync()) f.deleteSync();
                it.segDone[i] = f.existsSync() ? f.lengthSync() : 0;
              }
              _lastDone[it.id] = it.done;
            }

            /// نسأل الخادم عن الحجم وهل يدعم التحميل المجزأ (Range).
            Future<void> _probe(DownloadItem it, CancelToken t) async {
              final r = await _dio.get<ResponseBody>(
                it.url,
                cancelToken: t,
                options: Options(
                  responseType: ResponseType.stream,
                  headers: {...it.headers, 'Range': 'bytes=0-0'},
                ),
              );
              final cr = r.headers.value('content-range');
              if (r.statusCode == 206 && cr != null && cr.contains('/')) {
                it.total = int.tryParse(cr.split('/').last) ?? 0;
                it.resumable = it.total > 0;
              } else {
                it.total = int.tryParse(r.headers.value('content-length') ?? '') ?? 0;
                it.resumable = false;
              }
              if (it.total > 0 && it.total < 1024 * 1024) it.connections = 1;
              final sub = r.data!.stream.listen((_) {});
              await sub.cancel();
            }

            Future<void> _segment(DownloadItem it, int i, CancelToken t) async {
              final part = File('${it.path}.part$i');
              var done = it.segDone[i];
              final headers = <String, String>{...it.headers};

              if (it.resumable) {
                final len = it.segEnd(i) - it.segStart(i) + 1;
                if (done >= len) return;
                headers['Range'] = 'bytes=${it.segStart(i) + done}-${it.segEnd(i)}';
              }

              final r = await _dio.get<ResponseBody>(
                it.url,
                cancelToken: t,
                options: Options(responseType: ResponseType.stream, headers: headers),
              );
              if (it.resumable && r.statusCode != 206) {
                throw Exception('الخادم لا يدعم التحميل المجزأ');
              }

              final sink =
                  part.openWrite(mode: it.resumable ? FileMode.append : FileMode.write);
              try {
                await for (final chunk in r.data!.stream) {
                  await _throttle.take(chunk.length);
                  sink.add(chunk);
                  done += chunk.length;
                  it.segDone[i] = done;
                }
              } finally {
                await sink.close();
              }
            }

            // ---------- يوتيوب ----------

            /// في كل تشغيل نطلب رابط البث من جديد، فما في مشكلة انتهاء صلاحية.
            Future<void> _downloadYt(DownloadItem it, CancelToken token) async {
              final x = YoutubeExplode();
              try {
                final manifest = await x.videos.streamsClient.getManifest(it.ytId!);
                final info = manifest.streams.firstWhere((s) => s.tag == it.ytItag,
                    orElse: () => throw Exception('هالجودة لم تعد متاحة، أعد الاختيار'));
                it.total = info.size.totalBytes;
                it.segDone = [0];
                _lastDone[it.id] = 0;

                final sink = File('${it.path}.part0').openWrite();
                var done = 0;
                try {
                  await for (final chunk in x.videos.streamsClient.get(info)) {
                    if (token.isCancelled) break;
                    await _throttle.take(chunk.length);
                    sink.add(chunk);
                    done += chunk.length;
                    it.segDone[0] = done;
                  }
                } finally {
                  await sink.close();
                }
              } finally {
                x.close();
              }
            }

            // ---------- الدمج ----------

            Future<void> _merge(DownloadItem it) async {
              if (it.segCount == 1) {
                final p = File('${it.path}.part0');
                final target = File(it.path);
                if (target.existsSync()) target.deleteSync();
                await p.rename(it.path);
              } else {
                final out = File(it.path).openWrite();
                try {
                  for (var i = 0; i < it.segCount; i++) {
                    await out.addStream(File('${it.path}.part$i').openRead());
                  }
                } finally {
                  await out.close();
                }
                for (var i = 0; i < it.segCount; i++) {
                  final f = File('${it.path}.part$i');
                  if (f.existsSync()) f.deleteSync();
                }
              }
              if (it.total == 0) it.total = it.done;
            }

            void _deleteParts(DownloadItem it) {
              for (var i = 0; i < 16; i++) {
                final f = File('${it.path}.part$i');
                if (f.existsSync()) f.deleteSync();
              }
            }

            // ---------- التحكم ----------

            void pause(DownloadItem it) {
              if (it.status != DlStatus.downloading) return;
              it.status = DlStatus.paused;
              it.speed = 0;
              _tokens[it.id]?.cancel();
              _save();
              notifyListeners();
              _pump();
            }

            void resume(DownloadItem it, {bool viaMobile = false}) =>
                start(it, mobileOk: viaMobile);

            /// تجديد رابط منتهي: نبدل الرابط ونكمل من نفس المكان إذا الملف هو نفسه.
            Future<void> refreshLink(DownloadItem it, String newUrl) async {
              if (it.isYt) {
                start(it);
                return;
              }
              final oldTotal = it.total;
              final oldConns = it.connections;
              final oldResumable = it.resumable;
              it.url = newUrl.trim();
              it.error = null;

              if (oldTotal > 0) {
                it.total = 0;
                try {
                  await _probe(it, CancelToken());
                } catch (_) {
                  it.total = oldTotal;
                  it.connections = oldConns;
                  it.resumable = oldResumable;
                  it.status = DlStatus.failed;
                  it.error = 'الرابط الجديد لا يعمل';
                  notifyListeners();
                  return;
                }
                if (it.total == oldTotal && it.resumable == oldResumable) {
                  it.connections = oldConns; // نبقي نفس تقسيم الأجزاء
                } else {
                  _deleteParts(it); // ملف مختلف: نبدأ من الصفر
                  it.segDone = [];
                }
              } else {
                _deleteParts(it);
                it.segDone = [];
              }
              await _save();
              start(it);
            }

            Future<void> remove(DownloadItem it, {bool deleteFile = true}) async {
              _tokens[it.id]?.cancel();
              items.remove(it);
              notifyListeners();
              _pump();
              await Future.delayed(const Duration(milliseconds: 300));
              if (deleteFile) {
                _deleteParts(it);
                final f = File(it.path);
                if (f.existsSync()) f.deleteSync();
              }
              await _save();
            }

            // ---------- الخدمة الأمامية ----------

            void _syncService() {
              final act =
                  items.where((e) => e.status == DlStatus.downloading).toList();
              if (act.isEmpty) return;
              final total = act.fold<int>(0, (a, e) => a + e.total);
              final done = act.fold<int>(0, (a, e) => a + e.done);
              final pct = total > 0 ? (done * 100 / total).round() : -1;
              final title =
                  act.length == 1 ? act.first.name : '${act.length} تحميلات جارية';
              final text = '${fmtSpeed(totalSpeed)}${pct >= 0 ? ' · $pct%' : ''}';
              BackgroundService.show(title, text, pct);
            }

            // ---------- حساب السرعة ----------

            void _ensureTicker() {
              _ticker ??= Timer.periodic(const Duration(milliseconds: 500), (_) {
                var active = false;
                for (final it in items) {
                  if (it.status == DlStatus.downloading) {
                    active = true;
                    final last = _lastDone[it.id] ?? it.done;
                    final d = it.done;
                    final inst = max(0, d - last) * 2.0;
                    it.speed = it.speed == 0 ? inst : it.speed * 0.7 + inst * 0.3;
                    _lastDone[it.id] = d;
                  } else {
                    it.speed = 0;
                  }
                }
                notifyListeners();
                _ticks++;
                if (_ticks % 4 == 0) _save();
                if (active) {
                  if (_ticks % 2 == 0) _syncService();
                } else {
                  BackgroundService.stop();
                  _ticker?.cancel();
                  _ticker = null;
                }
              });
            }
          }
