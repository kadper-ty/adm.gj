          import 'dart:collection';

          import 'package:flutter/material.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          import '../adblock.dart';
          import '../services/download_manager.dart';
          import '../theme.dart';
          import '../utils.dart';
          import 'youtube_screen.dart';

          class _Tab {
            _Tab(this.id, this.initialUrl);
            final String id;
            final String initialUrl;
            InAppWebViewController? c;
            String url = '';
            String title = '';
            double progress = 0;
            bool canBack = false;
            bool canFwd = false;
          }

          class BrowserScreen extends StatefulWidget {
            const BrowserScreen({super.key, required this.onAdded});

            /// يُستدعى بعد إضافة تحميل ليرجع التطبيق لتبويب التحميلات.
            final VoidCallback onAdded;

            @override
            State<BrowserScreen> createState() => _BrowserScreenState();
          }

          class _BrowserScreenState extends State<BrowserScreen> {
            static const _home = 'https://www.google.com';
            static const _maxTabs = 8;

            final List<_Tab> _tabs = [];
            int _cur = 0;
            int _seq = 0;
            final _urlCtl = TextEditingController();

            _Tab get _t => _tabs[_cur];

            @override
            void initState() {
              super.initState();
              _tabs.add(_Tab('t${_seq++}', _home));
            }

            @override
            void dispose() {
              _urlCtl.dispose();
              super.dispose();
            }

            InAppWebViewSettings _settings() => InAppWebViewSettings(
                  useOnDownloadStart: true,
                  useShouldOverrideUrlLoading: true,
                  javaScriptCanOpenWindowsAutomatically: false,
                  supportMultipleWindows: false,
                  mediaPlaybackRequiresUserGesture: true,
                  allowsInlineMediaPlayback: true,
                  contentBlockers: manager.adBlock ? buildBlockers() : [],
                );

            UserScript get _antiDetect => UserScript(
                  source: kAntiDetectJs,
                  injectionTime: UserScriptInjectionTime.AT_DOCUMENT_START,
                  forMainFrameOnly: false,
                );

            bool get _isYtWatch {
              final cur = _t.url;
              if (!isYoutubeUrl(cur)) return false;
              final u = Uri.tryParse(cur);
              if (u == null) return false;
              return u.host == 'youtu.be' ||
                  u.path.startsWith('/shorts/') ||
                  (u.path == '/watch' && u.queryParameters.containsKey('v'));
            }

            // ---------- التبويبات ----------

            void _newTab({String? url}) {
              if (_tabs.length >= _maxTabs) {
                ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('الحد الأقصى 8 تبويبات')));
                return;
              }
              setState(() {
                _tabs.add(_Tab('t${_seq++}', url ?? _home));
                _cur = _tabs.length - 1;
                _urlCtl.text = '';
              });
            }

            void _switchTo(int i) {
              setState(() {
                _cur = i;
                _urlCtl.text = _t.url;
              });
            }

            void _closeTab(int i) {
              setState(() {
                _tabs.removeAt(i);
                if (_tabs.isEmpty) {
                  _tabs.add(_Tab('t${_seq++}', _home));
                  _cur = 0;
                } else if (_cur >= _tabs.length) {
                  _cur = _tabs.length - 1;
                } else if (i < _cur) {
                  _cur--;
                }
                _urlCtl.text = _t.url;
              });
            }

            void _showTabs() {
              showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheet) => SafeArea(
                    child: ConstrainedBox(
                      constraints: BoxConstraints(
                          maxHeight: MediaQuery.of(context).size.height * 0.7),
                      child: Column(mainAxisSize: MainAxisSize.min, children: [
                        Padding(
                          padding: const EdgeInsets.fromLTRB(20, 16, 12, 4),
                          child: Row(children: [
                            Expanded(
                                child: Text('التبويبات (${_tabs.length})',
                                    style: const TextStyle(
                                        fontSize: 18, fontWeight: FontWeight.w700))),
                            FilledButton.icon(
                              onPressed: () {
                                Navigator.pop(ctx);
                                _newTab();
                              },
                              icon: const Icon(Icons.add),
                              label: const Text('تبويب جديد'),
                            ),
                          ]),
                        ),
                        Flexible(
                          child: ListView.builder(
                            shrinkWrap: true,
                            padding: const EdgeInsets.fromLTRB(12, 8, 12, 16),
                            itemCount: _tabs.length,
                            itemBuilder: (_, i) {
                              final t = _tabs[i];
                              final host = Uri.tryParse(t.url)?.host ?? '';
                              final title = t.title.isNotEmpty
                                  ? t.title
                                  : (host.isNotEmpty ? host : 'تبويب جديد');
                              return Card(
                                color: i == _cur ? const Color(0xFFE6F1FA) : Colors.white,
                                margin: const EdgeInsets.only(bottom: 6),
                                child: ListTile(
                                  onTap: () {
                                    Navigator.pop(ctx);
                                    _switchTo(i);
                                  },
                                  leading: const Icon(Icons.public, color: kAccent),
                                  title: Text(title,
                                      maxLines: 1, overflow: TextOverflow.ellipsis),
                                  subtitle: Directionality(
                                    textDirection: TextDirection.ltr,
                                    child: Text(host,
                                        maxLines: 1, overflow: TextOverflow.ellipsis),
                                  ),
                                  trailing: IconButton(
                                    tooltip: 'إغلاق التبويب',
                                    icon: const Icon(Icons.close),
                                    onPressed: () {
                                      _closeTab(i);
                                      if (_tabs.isEmpty) return;
                                      setSheet(() {});
                                    },
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ]),
                    ),
                  ),
                ),
              );
            }

            // ---------- التنقل ----------

            void _go(String text) {
              var t = text.trim();
              if (t.isEmpty) return;
              Uri uri;
              if (!t.contains(' ') && t.contains('.')) {
                if (!t.startsWith('http')) t = 'https://$t';
                uri = Uri.parse(t);
              } else {
                uri = Uri.https('www.google.com', '/search', {'q': t});
              }
              _t.c?.loadUrl(urlRequest: URLRequest(url: WebUri(uri.toString())));
              FocusScope.of(context).unfocus();
            }

            Future<void> _refreshNav(_Tab t) async {
              final b = await t.c?.canGoBack() ?? false;
              final f = await t.c?.canGoForward() ?? false;
              t.canBack = b;
              t.canFwd = f;
              if (mounted) setState(() {});
            }

            Future<void> _toggleAdBlock() async {
              await manager.setAdBlock(!manager.adBlock);
              for (final t in _tabs) {
                await t.c?.setSettings(settings: _settings());
                await t.c?.removeAllUserScripts();
                if (manager.adBlock) await t.c?.addUserScript(userScript: _antiDetect);
              }
              await _t.c?.reload();
              if (!mounted) return;
              setState(() {});
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                  content: Text(manager.adBlock
                      ? 'مانع الإعلانات: شغّال'
                      : 'مانع الإعلانات: مطفي')));
            }

            Future<void> _onDownload(_Tab tab, DownloadStartRequest req) async {
              final url = req.url.toString();
              final name = (req.suggestedFilename?.isNotEmpty ?? false)
                  ? req.suggestedFilename!
                  : nameFromUrl(url);
              final cookies = await CookieManager.instance().getCookies(url: req.url);
              final headers = <String, String>{
                if (cookies.isNotEmpty)
                  'Cookie': cookies.map((c) => '${c.name}=${c.value}').join('; '),
                if (req.userAgent != null) 'User-Agent': req.userAgent!,
                if (tab.url.isNotEmpty) 'Referer': tab.url,
              };
              if (!mounted) return;
              final ok = await showModalBottomSheet<bool>(
                context: context,
                builder: (ctx) => Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    const Text('تحميل ملف',
                        style: TextStyle(fontSize: 18, fontWeight: FontWeight.w700)),
                    const SizedBox(height: 12),
                    Directionality(
                      textDirection: TextDirection.ltr,
                      child: Text(name,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontWeight: FontWeight.w600)),
                    ),
                    if (req.contentLength > 0)
                      Padding(
                        padding: const EdgeInsets.only(top: 6),
                        child: Text(fmtBytes(req.contentLength),
                            style: const TextStyle(color: kMuted)),
                      ),
                    const SizedBox(height: 16),
                    Row(children: [
                      Expanded(
                          child: OutlinedButton(
                              onPressed: () => Navigator.pop(ctx, false),
                              child: const Text('إلغاء'))),
                      const SizedBox(width: 10),
                      Expanded(
                          child: FilledButton.icon(
                              onPressed: () => Navigator.pop(ctx, true),
                              icon: const Icon(Icons.download),
                              label: const Text('تحميل'))),
                    ]),
                  ]),
                ),
              );
              if (ok == true) {
                await manager.add(url, name, manager.defaultConnections,
                    headers: headers);
                widget.onAdded();
              }
            }

            Widget _web(_Tab t) => InAppWebView(
                  key: ValueKey(t.id),
                  initialUrlRequest: URLRequest(url: WebUri(t.initialUrl)),
                  initialSettings: _settings(),
                  initialUserScripts: UnmodifiableListView<UserScript>(
                      manager.adBlock ? [_antiDetect] : []),
                  onWebViewCreated: (c) => t.c = c,
                  onProgressChanged: (c, p) {
                    t.progress = p / 100;
                    if (mounted && identical(t, _t)) setState(() {});
                  },
                  onTitleChanged: (c, title) => t.title = title ?? '',
                  onUpdateVisitedHistory: (c, url, _) {
                    t.url = url?.toString() ?? '';
                    if (identical(t, _t) && !FocusScope.of(context).hasFocus) {
                      _urlCtl.text = t.url;
                    }
                    _refreshNav(t);
                  },
                  shouldOverrideUrlLoading: (c, nav) async {
                    final s = nav.request.url?.scheme ?? '';
                    const ok = [
                      'http', 'https', 'about', 'blob', 'data', 'file', 'javascript'
                    ];
                    return ok.contains(s)
                        ? NavigationActionPolicy.ALLOW
                        : NavigationActionPolicy.CANCEL;
                  },
                  onDownloadStartRequest: (c, req) => _onDownload(t, req),
                );

            @override
            Widget build(BuildContext context) {
              final t = _t;
              return SafeArea(
                child: Column(children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(4, 8, 4, 4),
                    child: Row(children: [
                      IconButton(
                          tooltip: 'رجوع',
                          onPressed: t.canBack ? () => t.c?.goBack() : null,
