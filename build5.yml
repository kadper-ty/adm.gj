          /// سكربتات يجب أن تبقى متاحة حتى لا يكتشف الموقع أن المانع شغال.
          const List<String> _kAllowScripts = [
            r'^https?://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js',
            r'^https?://www\.googletagservices\.com/tag/js/gpt\.js',
            r'^https?://securepubads\.g\.doubleclick\.net/tag/js/gpt\.js',
          ];

          const String _kHideCss =
              'ins.adsbygoogle, iframe[src*="doubleclick.net"], '
              'iframe[src*="googlesyndication.com"], iframe[id^="google_ads"], '
              'div[id^="google_ads"], div[id^="div-gpt-ad"], div[id^="taboola-"], '
              'div.taboola, div[id^="outbrain"], div.OUTBRAIN, '
              'a[href*="doubleclick.net"], a[href*="adsterra"], '
              'iframe[src*="exoclick"], iframe[src*="propellerads"]';

          List<ContentBlocker> buildBlockers() {
            final rules = <ContentBlocker>[];
            for (final d in kAdDomains) {
              rules.add(ContentBlocker(
                trigger: ContentBlockerTrigger(
                    urlFilter: r'^https?://([^/]*\.)?' + RegExp.escape(d) + r'(:|/|$)'),
                action: ContentBlockerAction(type: ContentBlockerActionType.BLOCK),
              ));
            }
            rules.add(ContentBlocker(
              trigger: ContentBlockerTrigger(
                  urlFilter: r'.*(/pagead/ads|/adserver/|/popunder|/prebid\.js).*'),
              action: ContentBlockerAction(type: ContentBlockerActionType.BLOCK),
            ));
            // استثناءات (لازم تجي بعد قواعد الحجب)
            for (final s in _kAllowScripts) {
              rules.add(ContentBlocker(
                trigger: ContentBlockerTrigger(urlFilter: s),
                action:
                    ContentBlockerAction(type: ContentBlockerActionType.IGNORE_PREVIOUS_RULES),
              ));
            }
            // إخفاء حاويات الإعلانات
            rules.add(ContentBlocker(
              trigger: ContentBlockerTrigger(urlFilter: '.*'),
              action: ContentBlockerAction(
                  type: ContentBlockerActionType.CSS_DISPLAY_NONE, selector: _kHideCss),
            ));
            return rules;
          }

          /// يُحقن في بداية كل صفحة: يوهم الموقع أن الإعلانات تعمل بشكل طبيعي.
          const String kAntiDetectJs = r'''
          (function(){
            try {
              window.canRunAds = true;
              window.adsbygoogle = window.adsbygoogle || [];
              window.adsbygoogle.loaded = true;
              if (!window.adsbygoogle.push || window.adsbygoogle.push === Array.prototype.push) {
                window.adsbygoogle.push = function(){};
              }
              window.google_ad_status = 1;
              var bait = /(^|\s)(ad|ads|adsbox|ad-banner|ad-placement|ad-unit|adsbygoogle|banner_ad|textads|text-ad|pub_300x250|pub_728x90|sponsor|sponsored)(\s|$)/i;
              ['offsetHeight','offsetWidth','clientHeight','clientWidth'].forEach(function(p){
                var d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, p) ||
                        Object.getOwnPropertyDescriptor(Element.prototype, p);
                if (!d || !d.get) return;
                Object.defineProperty(HTMLElement.prototype, p, {
                  configurable: true,
                  get: function(){
                    var v = d.get.call(this);
                    if (v === 0 && bait.test(String(this.className || ''))) return 1;
                    return v;
                  }
                });
              });
              var cs = window.getComputedStyle;
              window.getComputedStyle = function(el, pseudo){
                var s = cs.call(window, el, pseudo);
                try {
                  if (el && bait.test(String(el.className || ''))) {
                    return new Proxy(s, {
                      get: function(t, k){
                        if (k === 'display') return 'block';
                        if (k === 'visibility') return 'visible';
                        var v = t[k];
                        return typeof v === 'function' ? v.bind(t) : v;
                      }
                    });
                  }
                } catch(e) {}
                return s;
              };
            } catch (e) {}
          })();
          ''';
