          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import '../services/background.dart';
          import '../services/download_manager.dart';
          import '../utils.dart';
          import 'browser_screen.dart';
          import 'files_screen.dart';
          import 'home_screen.dart';
          import 'youtube_screen.dart';

          class MainShell extends StatefulWidget {
            const MainShell({super.key});

            @override
            State<MainShell> createState() => _MainShellState();
          }

          class _MainShellState extends State<MainShell> with WidgetsBindingObserver {
            int _i = 0;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              WidgetsBinding.instance.addPostFrameCallback((_) async {
                await _askBackground();
                _checkClipboard();
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) _checkClipboard();
            }

            /// إذا نسخت رابط، بنعرض عليك تحميله.
            Future<void> _checkClipboard() async {
              await Future.delayed(const Duration(milliseconds: 600));
              final data = await Clipboard.getData(Clipboard.kTextPlain);
              final t = data?.text?.trim() ?? '';
              final u = Uri.tryParse(t);
              if (u == null ||
                  !(u.scheme == 'http' || u.scheme == 'https') ||
                  u.host.isEmpty ||
                  t.contains(' ') ||
                  t.contains('\n')) {
                return;
              }
              final prefs = await SharedPreferences.getInstance();
              if (prefs.getString('last_clip') == t) return;
              await prefs.setString('last_clip', t);
              if (manager.items.any((e) => e.url == t)) return;
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                duration: const Duration(seconds: 10),
                content: Text('رابط منسوخ: ${u.host}'),
                action: SnackBarAction(
                  label: 'تحميل',
                  onPressed: () {
                    if (isYoutubeUrl(t)) {
                      Navigator.push(context,
                          MaterialPageRoute(builder: (_) => YoutubeScreen(url: t)));
                    } else {
                      manager.add(t, nameFromUrl(t), manager.defaultConnections);
                      setState(() => _i = 0);
                    }
                  },
                ),
              ));
            }

            /// نطلب إذن الإشعارات وإعفاء التطبيق من تقييد البطارية (حد أقصى 3 مرات).
            Future<void> _askBackground() async {
              if (!Platform.isAndroid) return;
              final prefs = await SharedPreferences.getInstance();
              final ignoring = await BackgroundService.isIgnoringBattery();
              final asked = prefs.getInt('bg_asked') ?? 0;
              if (ignoring || asked >= 3 || !mounted) return;
              await prefs.setInt('bg_asked', asked + 1);
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('التحميل بالخلفية'),
                  content: const Text(
                      'لتكمل التحميلات والشاشة مطفية أو وأنت بتستخدم تطبيق تاني، بدنا إذنين:\n\n١. إظهار إشعار التحميل.\n٢. عدم تقييد التطبيق بالبطارية.\n\nرح تظهر لك رسالتين من النظام، اضغط "سماح" فيهم.',
                      style: TextStyle(height: 1.6)),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('لاحقاً')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('متابعة')),
                  ],
                ),
              );
              if (ok != true) return;
              await BackgroundService.requestNotifPermission();
              await BackgroundService.requestIgnoreBattery();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(index: _i, children: [
                  const HomeScreen(),
                  BrowserScreen(onAdded: () => setState(() => _i = 0)),
                  const FilesScreen(),
                ]),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _i,
                  onDestinationSelected: (v) => setState(() => _i = v),
                  destinations: const [
                    NavigationDestination(
                        icon: Icon(Icons.download_outlined),
                        selectedIcon: Icon(Icons.download),
                        label: 'التحميلات'),
                    NavigationDestination(icon: Icon(Icons.public), label: 'المتصفح'),
                    NavigationDestination(
                        icon: Icon(Icons.folder_outlined),
                        selectedIcon: Icon(Icons.folder),
                        label: 'الملفات'),
                  ],
                ),
              );
            }
          }
