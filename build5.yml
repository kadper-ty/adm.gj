          cat > lib/utils.dart <<'DART_EOF'
          String fmtBytes(num b) {
            if (b < 1024) return '${b.toStringAsFixed(0)} B';
            const units = ['KB', 'MB', 'GB', 'TB'];
            double v = b / 1024;
            int i = 0;
            while (v >= 1024 && i < units.length - 1) {
              v /= 1024;
              i++;
            }
            return '${v.toStringAsFixed(v >= 100 ? 0 : 1)} ${units[i]}';
          }

          String fmtSpeed(num bytesPerSec) => '${fmtBytes(bytesPerSec)}/s';

          String fmtEta(Duration d) {
            String two(int n) => n.toString().padLeft(2, '0');
            final h = d.inHours;
            final m = d.inMinutes % 60;
            final s = d.inSeconds % 60;
            return h > 0 ? '$h:${two(m)}:${two(s)}' : '$m:${two(s)}';
          }

          String nameFromUrl(String url) {
            try {
              final uri = Uri.parse(url.trim());
              final segs = uri.pathSegments.where((s) => s.isNotEmpty).toList();
              if (segs.isEmpty) return 'file';
              return Uri.decodeComponent(segs.last);
            } catch (_) {
              return 'file';
            }
          }

          enum FileKind { video, audio, image, doc, archive, other }

          FileKind kindOf(String name) {
            final ext = name.contains('.') ? name.split('.').last.toLowerCase() : '';
            if (['mp4', 'mkv', 'avi', 'mov', 'webm', '3gp', 'flv'].contains(ext)) {
              return FileKind.video;
            }
            if (['mp3', 'm4a', 'wav', 'flac', 'ogg', 'opus', 'aac'].contains(ext)) {
              return FileKind.audio;
            }
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].contains(ext)) {
              return FileKind.image;
            }
            if (['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'epub']
                .contains(ext)) {
              return FileKind.doc;
            }
            if (['zip', 'rar', '7z', 'tar', 'gz', 'apk'].contains(ext)) {
              return FileKind.archive;
            }
            return FileKind.other;
          }

          String kindLabel(FileKind k) {
            switch (k) {
              case FileKind.video:
                return 'فيديو';
              case FileKind.audio:
                return 'صوت';
              case FileKind.image:
                return 'صور';
              case FileKind.doc:
                return 'مستندات';
              case FileKind.archive:
                return 'أرشيف';
              case FileKind.other:
                return 'أخرى';
            }
          }

          String mimeOf(String name) {
            final ext = name.contains('.') ? name.split('.').last.toLowerCase() : '';
            const m = {
              'mp4': 'video/mp4', 'mkv': 'video/x-matroska', 'webm': 'video/webm',
              'mov': 'video/quicktime', 'avi': 'video/x-msvideo', '3gp': 'video/3gpp',
              'mp3': 'audio/mpeg', 'm4a': 'audio/mp4', 'wav': 'audio/wav',
              'flac': 'audio/flac', 'ogg': 'audio/ogg', 'opus': 'audio/ogg',
              'aac': 'audio/aac', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg',
              'png': 'image/png', 'gif': 'image/gif', 'webp': 'image/webp',
              'pdf': 'application/pdf', 'zip': 'application/zip',
              'apk': 'application/vnd.android.package-archive', 'txt': 'text/plain',
            };
            return m[ext] ?? 'application/octet-stream';
          }
