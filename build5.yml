          /// يحدّ السرعة الإجمالية لكل التحميلات (bytes/second، 0 = بلا حد).
          class _Throttle {
            int bytesPerSec = 0;
            final Stopwatch _sw = Stopwatch()..start();
            int _nextUs = 0;

            Future<void> take(int n) async {
              if (bytesPerSec <= 0) return;
              final now = _sw.elapsedMicroseconds;
              final start = _nextUs > now ? _nextUs : now;
              _nextUs = start + (n * 1000000 ~/ bytesPerSec);
              final wait = start - now;
              if (wait > 1000) await Future.delayed(Duration(microseconds: wait));
            }
          }

          /// نسخة واحدة تُستخدم في كل التطبيق.
          final DownloadManager manager = DownloadManager();

          const _kUserAgent =
              'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/120.0.0.0 Mobile Safari/537.36';

          class DownloadManager extends ChangeNotifier {
            final Dio _dio = Dio(BaseOptions(
              connectTimeout: const Duration(seconds: 20),
              receiveTimeout: const Duration(seconds: 30),
              followRedirects: true,
              headers: {'User-Agent': _kUserAgent},
            ));

            final _Throttle _throttle = _Throttle();
            final List<DownloadItem> items = [];
            final Map<String, CancelToken> _tokens = {};
            final Map<String, int> _lastDone = {};
            Timer? _ticker;
            int _ticks = 0;
            late Directory dir;

            /// مانع الإعلانات في المتصفح
            bool adBlock = true;
            bool wifiOnly = false;
            int maxConcurrent = 3;
            int defaultConnections = 4;

            /// حد السرعة بالـ KB/s (0 = بلا حد)
            int speedLimitKBps = 0;

            // ---------- التهيئة والحفظ ----------

            Future<void> init() async {
              Directory base;
              try {
                base = await getExternalStorageDirectory() ??
                    await getApplicationDocumentsDirectory();
              } catch (_) {
                base = await getApplicationDocumentsDirectory();
              }
              dir = Directory('${base.path}/Downloads');
              await dir.create(recursive: true);

              final prefs = await SharedPreferences.getInstance();
              adBlock = prefs.getBool('adblock') ?? true;
              wifiOnly = prefs.getBool('wifionly') ?? false;
              maxConcurrent = prefs.getInt('maxconc') ?? 3;
              defaultConnections = prefs.getInt('defconn') ?? 4;
              speedLimitKBps = prefs.getInt('speedlimit') ?? 0;
              _throttle.bytesPerSec = speedLimitKBps * 1024;
              _startWifiWatcher();
              final raw = prefs.getString('items');
              if (raw != null) {
                for (final m in jsonDecode(raw) as List) {
                  final it = DownloadItem.fromJson(m as Map<String, dynamic>);
                  if (it.status == DlStatus.downloading || it.status == DlStatus.queued) {
                    it.status = DlStatus.paused;
                  }
                  items.add(it);
                }
              }
            }

            Future<void> _save() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString(
                  'items', jsonEncode(items.map((e) => e.toJson()).toList()));
            }

            Future<void> setAdBlock(bool v) async {
              adBlock = v;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool('adblock', v);
              notifyListeners();
            }

            Future<void> setWifiOnly(bool v) async {
              wifiOnly = v;
              (await SharedPreferences.getInstance()).setBool('wifionly', v);
              notifyListeners();
            }

            Future<void> setMaxConcurrent(int v) async {
              maxConcurrent = v;
              (await SharedPreferences.getInstance()).setInt('maxconc', v);
              notifyListeners();
              _pump();
            }

            Future<void> setSpeedLimit(int kb) async {
              speedLimitKBps = kb < 0 ? 0 : kb;
              _throttle.bytesPerSec = speedLimitKBps * 1024;
              (await SharedPreferences.getInstance()).setInt('speedlimit', speedLimitKBps);
              notifyListeners();
            }

            /// كل 15 ثانية: إذا في ملفات منتظرة واي فاي واتصلنا فعلاً، نكمّلها.
            void _startWifiWatcher() {
              Timer.periodic(const Duration(seconds: 15), (_) async {
                final waiting = items
                    .where((e) => e.status == DlStatus.paused && e.error == kWaitWifi)
                    .toList();
                if (waiting.isEmpty) return;
                if (wifiOnly && await BackgroundService.isMetered()) return;
                for (final it in waiting) {
                  start(it);
                }
              });
