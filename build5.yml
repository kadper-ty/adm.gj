          import 'package:flutter/material.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart' as yt;

          import '../services/download_manager.dart';
          import '../theme.dart';
          import '../utils.dart';

          bool isYoutubeUrl(String url) {
            final h = Uri.tryParse(url.trim())?.host.toLowerCase() ?? '';
            return h == 'youtu.be' || h.endsWith('youtube.com');
          }

          class _Opt {
            _Opt(this.info, this.label, this.ext, this.size, this.isAudio);
            final yt.StreamInfo info;
            final String label;
            final String ext;
            final int size;
            final bool isAudio;
          }

          class _Data {
            _Data(this.video, this.opts);
            final yt.Video video;
            final List<_Opt> opts;
          }

          class YoutubeScreen extends StatefulWidget {
            const YoutubeScreen({super.key, required this.url});
            final String url;

            @override
            State<YoutubeScreen> createState() => _YoutubeScreenState();
          }

          class _YoutubeScreenState extends State<YoutubeScreen> {
            late final Future<_Data> _future = _fetch();
            int _selected = 0;

            Future<_Data> _fetch() async {
              final x = yt.YoutubeExplode();
              try {
                final video = await x.videos.get(widget.url);
                final m = await x.videos.streamsClient.getManifest(video.id);
                final opts = <_Opt>[];

                final muxed = m.muxed.toList()
                  ..sort((a, b) =>
                      b.videoResolution.height.compareTo(a.videoResolution.height));
                for (final s in muxed) {
                  opts.add(_Opt(
                    s,
                    'فيديو ${s.qualityLabel} · ${s.container.name.toUpperCase()}',
                    s.container.name,
                    s.size.totalBytes,
                    false,
                  ));
                }

